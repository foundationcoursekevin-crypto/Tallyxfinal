name: Build Windows EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip app
        shell: pwsh
        run: Expand-Archive -Path tally-github-ready.zip -DestinationPath app
      - name: Fix file names
        working-directory: app
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.build.win = @{ target = @("portable","nsis") }
          $p.build.nsis = @{ oneClick = $false; allowToChangeInstallationDirectory = $true; artifactName = 'Tally-Setup-${version}.${ext}' }
          $p.build | Add-Member -NotePropertyName portable -NotePropertyValue @{ artifactName = 'Tally-Portable-${version}.${ext}' } -Force
          $p | ConvertTo-Json -Depth 10 | Set-Content package.json
      - name: Build
        working-directory: app
        run: |
          npm install
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Tally-Windows
          path: app/dist/*.exe
